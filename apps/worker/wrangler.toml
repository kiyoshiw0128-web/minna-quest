name = "minna-quest"
main = "src/index.ts"
# この日付は本番にもそのまま適用される。ローカルの workerd がこれ以降の日付を
# 受け付けなかったため長らく 2024-12-30 に据え置いていたが、2026-09-05 に
# wrangler と vitest-pool-workers を上げて解消した。
#
# **テストと本番で同じ日付が効いていることが重要。** ローカルの実行環境が
# 古いまま日付だけ上げると、警告を出して黙って古い挙動に丸められ、
# 本番だけが未検証の設定で動くことになる。日付を動かすときは、
# 手元のテストがその日付で実際に走っていることを確かめること。
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "minna-quest"
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
crons = ["0 20 * * *"]

# apps/web のビルド成果物（apps/web/dist）を配信する。
# run_worker_first を付けないと、静的アセットが Worker のコードより先に
# 評価され、`/api/*`宛のリクエストでもアセット側が先に判定してしまう
# （既定は asset-first のため）。必ず Worker のコードを先に通し、
# `/api/*` を確実に処理させてからアセットへフォールバックする。
[assets]
directory = "../web/dist"
run_worker_first = true
binding = "ASSETS"
# SPA なので、アセットに無いパス（クライアント側ルート）は index.html を返す。
not_found_handling = "single-page-application"
